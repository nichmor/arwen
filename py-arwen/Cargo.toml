[package]
name = "py-arwen"
version = "0.0.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "arwen"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py38"] }
arwen-elf = { path = "../crates/arwen-elf" }
arwen-macho = { path = "../crates/arwen-macho" }
thiserror = "2.0.11"
object = { version = "0.40.0", default-features = false, features = ["build", "std"] }

# Prevent package from thinking it's in the workspace
[workspace]


[build-dependencies]
pyo3-build-config = "0.25.0"
